name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt flake8 pytest

      - name: Lint
        run: flake8 app.py tests.py

      - name: Tests
        run: pytest tests.py

      - name: Build image
        run: docker build -t myapp:${{ github.sha }} .
