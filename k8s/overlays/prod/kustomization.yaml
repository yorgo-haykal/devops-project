apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod

resources:
  - ../../base

replicas:
  - name: myapp
    count: 5

labels:
  - pairs:
      env: prod
    includeSelectors: false

configMapGenerator:
  - name: myapp-config
    literals:
      - APP_ENV=prod

secretGenerator:
  - name: myapp-secret
    literals:
      - API_KEY=changeme

generatorOptions:
  disableNameSuffixHash: true

patches:
  - target:
      kind: Deployment
      name: myapp
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          git-commit: e2aafa2142832bec55000f5885e0289a58476e97
          pipeline-run: https://github.com/yorgo-haykal/devops-project/actions/runs/44078797914
          owner: devops-team
          ticket: LAB2-001