apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod

resources:
  - ../../base

replicas:
  - name: myapp
    count: 3

patches:
  - target:
      kind: ConfigMap
      name: myapp-config
    patch: |-
      - op: replace
        path: /data/APP_ENV
        value: prod

labels:
  - pairs:
      environment: prod
    includeSelectors: false
