apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev

resources:
  - ../../base

replicas:
  - name: myapp
    count: 3

labels:
  - pairs:
      env: dev
    includeSelectors: false

configMapGenerator:
  - name: myapp-config
    literals:
      - APP_ENV=dev

secretGenerator:
  - name: myapp-secret
    literals:
      - API_KEY=changeme

generatorOptions:
  disableNameSuffixHash: true

images:
  - name: ghcr.io/yorgo-haykal/devops-project
    newTag: f8bac8baba69535cb2af0c55f6527cb1c0d80ab5