apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

resources:
  - ../../base

replicas:
  - name: myapp
    count: 2

patches:
  - target:
      kind: ConfigMap
      name: myapp-config
    patch: |-
      - op: replace
        path: /data/APP_ENV
        value: staging

labels:
  - pairs:
      environment: staging
    includeSelectors: false
