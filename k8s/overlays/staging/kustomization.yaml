apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

resources:
  - ../../base

replicas:
  - name: myapp
    count: 3

labels:
  - pairs:
      env: staging
    includeSelectors: false

configMapGenerator:
  - name: myapp-config
    literals:
      - APP_ENV=staging

secretGenerator:
  - name: myapp-secret
    literals:
      - API_KEY=changeme

generatorOptions:
  disableNameSuffixHash: true