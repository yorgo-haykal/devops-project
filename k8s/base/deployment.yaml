apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  annotations:
    commit-sha: "18c362903f1dcafa6944059f85caf596f5c16515"
    pipeline-run-url: "https://github.com/yorgo-haykal/devops-project/actions/runs/18c362903f1dcafa6944059f85caf596f5c16515"
    owner: "Leanna S"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: myapp
          image: ghcr.io/yorgo-haykal/devops-project:88a8bb50023441e3ea44c8f77d6e4f41eddac03a
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: myapp-config
                  key: APP_ENV
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: myapp-secret
                  key: API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
